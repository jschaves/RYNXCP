[workspace]
resolver = "2"
members = [
    "crates/rynx-proto",
    "crates/rynx-core",
    "crates/rynx-panel",
    "crates/rynxd",
    "crates/rynx-api",
    "crates/rynx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
authors = ["RYNXCP"]
repository = "https://example.invalid/rynxcp"

[workspace.dependencies]
axum = { version = "0.8", features = ["http1", "tokio", "json", "macros"] }
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
libc = "0.2"
mime_guess = "2"
once_cell = "1"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
